[project]
name = "aoc"
version = "0.1.0"
description = "Advent of Code solutions"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "python-dotenv",
    "requests",
    "z3-solver",
]

[project.scripts]
new-day = "aoc_utils.scaffold:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aoc_utils"
