[project]
name = "aoc"
version = "0.1.0"
description = "Advent of Code solutions"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "python-dotenv",
    "requests",
    "z3-solver",
]

[project.scripts]
new-day = "aoc_utils.scaffold:main"
run-day = "aoc_utils.runner:main"

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aoc_utils"

[tool.ruff.lint.pyflakes]
# Keep unused helper imports so they are ready to use while solving.
allowed-unused-imports = ["aoc_utils", "math"]
